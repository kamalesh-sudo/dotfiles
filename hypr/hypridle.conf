# Screen off after 10 minutes of inactivity
# unless VLC/mpv is playing
listener {
    timeout = 600

    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on

    # Fix: Placed the inversion directly inside the grep logic
    condition_cmd = playerctl --all-players status 2>/dev/null | grep -qv '^Playing$'
    condition_retry = 30
}

# Power off after 2 hours of inactivity
# unless VLC/mpv is playing
listener {
    timeout = 3600

    on-timeout = systemctl poweroff

    # Fix: Placed the inversion directly inside the grep logic
    condition_cmd = playerctl --all-players status 2>/dev/null | grep -qv '^Playing$'
    condition_retry = 30
}

