#
# ~/.config/hypr/hyprlock.conf
# Minimal aesthetic lockscreen — built for eDP-1 @ 1920x1080
#
permission = /usr/bin/hyprlock, screencopy, allow

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
    grace = 0
    disable_loading_bar = true
}

# ---------------------------------------------------------------------------
# BACKGROUND
# ---------------------------------------------------------------------------
background {
    monitor = eDP-1
    path = ~/.cache/yahpax/rice/current
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.68
    vibrancy = 0.18
    vibrancy_darkness = 0.15
}

# ---------------------------------------------------------------------------
# TIME — single line "H:MM AM/PM", vertically centered, offset up
# Occupies roughly y = 315-445 (screen center 540, -160 offset, ~130px tall)
# ---------------------------------------------------------------------------
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 130
    font_family = JetBrains Mono Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
    shadow_boost = 1.2
    position = 0, 0
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------
# DATE — sits below time with a clean 40px gap
# Occupies roughly y = 485-515
# ---------------------------------------------------------------------------
label {
    monitor = eDP-1
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(255, 255, 255, 0.75)
    font_size = 20
    font_family = JetBrains Mono Nerd Font Medium
    position = 0, 120
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------
# GREETING — above input field
# Occupies roughly y = 550-570
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# TIME-BASED GREETING / ROAST
# ---------------------------------------------------------------------------
label {
    monitor = eDP-1
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-greeting.sh
    color = rgba(255, 255, 255, 0.85)
    font_size = 16
    font_family = JetBrains Mono Nerd Font Medium
    position = 0, -230
    halign = center
    valign = center
}
# ---------------------------------------------------------------------------
# INPUT FIELD — clean pill, glass look
# Occupies roughly y = 602-657
# ---------------------------------------------------------------------------
input-field {
    monitor = eDP-1
    size = 280, 55
    outline_thickness = 2
    rounding = 28

    inner_color = rgba(255, 255, 255, 0.08)
    outer_color = rgba(255, 255, 255, 0.25)
    font_color = rgba(255, 255, 255, 0.9)

    check_color = rgba(148, 226, 213, 0.9)
    fail_color = rgba(243, 139, 168, 0.9)
    fail_text = <i>$FAIL</i>
    fail_transition = 250

    placeholder_text = <i>Enter password</i>
    placeholder_color = rgba(255, 255, 255, 0.4)

    dots_size = 0.28
    dots_spacing = 0.25
    dots_rounding = -1
    fade_on_empty = true
    fade_timeout = 1500

    hide_input = false

    position = 0, -300
    halign = center
    valign = center
}
